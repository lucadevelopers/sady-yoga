<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sady Yoga | Yoga & Pilates - Saadiya Belkhadri</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f7f4ef;
            --card-bg: #ffffff;
            --primary-color: #8c7355; /* Tortora caldo */
            --primary-light: #d6ccbe; /* Beige chiaro */
            --text-color: #4a4238;
            --accent-color: #b59f84;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header & Nav */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(247, 244, 239, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(140, 115, 85, 0.05);
            transition: var(--transition);
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo-nav {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8rem 2rem 4rem;
            background: linear-gradient(135deg, #f7f4ef 0%, #e8e1d5 100%);
        }

        .profile-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(140, 115, 85, 0.2);
            margin-bottom: 1.5rem;
            animation: float 4s ease-in-out infinite;
        }

        .profile-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .hero p.subtitle {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
        }

        /* Main Container & Sections */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        section {
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(140, 115, 85, 0.08);
            border: 1px solid var(--primary-light);
            position: relative;
            overflow: hidden;
        }

        .card h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card h2 i {
            font-size: 1.5rem;
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
        }

        /* Lists & Styling */
        ul {
            list-style: none;
        }

        ul li {
            margin-bottom: 0.8rem;
            position: relative;
            padding-left: 1.5rem;
        }

        ul li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.2rem;
        }

        p {
            margin-bottom: 1rem;
            color: #555;
        }

        /* Contact Section */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .contact-item i {
            color: var(--primary-color);
            font-size: 1.3rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background: var(--primary-color);
            color: #fff;
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .pulse-btn {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(140, 115, 85, 0.3);
        }

        .pulse-btn:hover {
            background: #735d43;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <div class="logo-nav">SADY YOGA</div>
            <ul class="nav-links">

                <li><a href="#formazione">Formazione</a></li>
                <li><a href="#esperienza">Esperienza</a></li>

                <li><a href="#contatti">Contatti</a></li>
            </ul>
        </nav>
